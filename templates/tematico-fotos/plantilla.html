<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel temático</title>
<style>
/* Carrusel temático (v2, 3-nov-2026). Formato por omisión 4:5 = 1080x1350, el de 35 de los 40 carruseles con más
   likes del radar (3:4 sigue disponible con "formato": "3:4"). Reglas que no se negocian (Manuel, 3-nov):
   - TODO el texto alineado a la izquierda en el mismo margen (72 px) y anclado arriba (o abajo en «sangre»); nada
     centrado a media lámina ni bloques flotando.
   - Ninguna lámina de puro texto: cada una lleva un recurso visual que da contexto (escena ilustrada, captura real,
     comparativa, chat de ejemplo, personaje o foto).
   - Sin serie, sin número de lámina, sin paginador, sin frases de transición.
   Guía: references/REMIX-VIRAL.md y references/DIRECCION-DE-ARTE.md §«Carrusel con contexto visual». */
@font-face { font-family: 'Anton'; src: url('../../assets/fonts/Anton.ttf'); }
@font-face { font-family: 'Archivo'; src: url('../../assets/fonts/Archivo.ttf'); font-weight: 100 900; }
:root { --acento: #00d7c0; --sello: #f5c84c; --tinta: #05080a; --blanco: #ffffff; --alto: 1350px; --margen: 72px;
  --bien: #2fd27a; --mal: #ff3b30; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: var(--alto); overflow: hidden; background: var(--tinta); }
.lam { position: relative; width: 1080px; height: var(--alto); overflow: hidden; color: var(--blanco); font-family: 'Archivo', sans-serif; }
.fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fondo.borroso { filter: blur(26px) brightness(.32) saturate(1.15); transform: scale(1.15); }
.fondo.tenue { filter: brightness(.38) saturate(1.05); }
.velo-abajo { position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(to top, rgba(3,6,8,.96) 0%, rgba(3,6,8,.8) 48%, rgba(3,6,8,0) 100%); }
.velo-arriba { position: absolute; left: 0; right: 0; top: 0; height: 52%;
  background: linear-gradient(to bottom, rgba(3,6,8,.92) 0%, rgba(3,6,8,.72) 45%, rgba(3,6,8,0) 100%); }
.halo { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 58%, color-mix(in srgb, var(--acento) 18%, transparent), transparent 70%); }
.grano { position: absolute; inset: 0; opacity: .13; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.9'/></svg>"); }
.caja { position: absolute; left: var(--margen); right: var(--margen); z-index: 3; }
.titulo { font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: .98; letter-spacing: .5px;
  font-size: 104px; text-shadow: 0 6px 26px rgba(0,0,0,.6); }
.titulo em { font-style: normal; color: var(--acento); }
.cuerpo { font-weight: 600; font-size: 38px; line-height: 1.3; margin-top: 22px; color: rgba(255,255,255,.94);
  text-shadow: 0 3px 14px rgba(0,0,0,.65); }
.cuerpo b { color: var(--acento); font-weight: 800; }
.impresa { position: absolute; background: #f4f1ea; padding: 22px 22px 70px; box-shadow: 0 34px 70px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.4) inset; }
.impresa .ventana { width: 100%; height: 100%; overflow: hidden; }
.impresa img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.92) contrast(1.03); }
.impresa .credito { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-weight: 600; font-size: 22px; color: #6b6a66; letter-spacing: .3px; }
.impresa .ano { font-family: 'Anton'; font-size: 30px; color: #1a1a1a; letter-spacing: 1px; bottom: 12px; }
.credito-suelto { position: absolute; right: 34px; bottom: 26px; font-weight: 600; font-size: 22px; color: rgba(255,255,255,.62); z-index: 4; }
/* sello sin giro: su orilla izquierda cae en el mismo margen que el titular (Manuel, 3-nov: «subtítulos desacomodados») */
.sello { display: inline-block; font-family: 'Anton'; text-transform: uppercase; font-size: 50px; color: var(--tinta);
  background: var(--sello); padding: 8px 22px 2px; box-shadow: 0 12px 32px rgba(0,0,0,.5); margin-bottom: 26px; }
/* marca suelta (estampa de texto por código): { t, x, y, giro, color } */
.marca { position: absolute; z-index: 3; font-family: 'Anton'; text-transform: uppercase; font-size: 52px; letter-spacing: 2px;
  color: var(--c); border: 7px solid var(--c); border-radius: 12px; padding: 6px 20px 0; opacity: .92; mix-blend-mode: screen; }
.firma { position: absolute; left: var(--margen); bottom: 40px; font-weight: 700; font-size: 30px; color: rgba(255,255,255,.78); letter-spacing: .5px; z-index: 4; }
/* captura real: tarjeta con esquinas, sombra, fuente y sello opcional */
.cap { position: absolute; z-index: 2; }
.cap .hoja { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.18); }
.cap .hoja img { display: block; width: 100%; }
.cap .fuente { display: inline-block; margin-top: 14px; font-weight: 700; font-size: 22px; color: rgba(255,255,255,.85);
  background: rgba(0,0,0,.55); padding: 7px 16px; border-radius: 999px; }
.cap .estampa { position: absolute; top: -26px; right: -18px; font-family: 'Anton'; text-transform: uppercase; font-size: 46px;
  color: var(--mal); border: 6px solid var(--mal); border-radius: 12px; padding: 4px 18px 0; transform: rotate(8deg);
  background: rgba(255,255,255,.92); box-shadow: 0 10px 26px rgba(0,0,0,.45); letter-spacing: 1px; }
/* elementos sueltos (personajes 3D, avatares, recortes, íconos, logos), siempre PNG con transparencia */
.elem { position: absolute; z-index: 2; filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); }
/* comparativa: dos columnas con encabezado ✗ / ✓ */
.comp { position: absolute; left: var(--margen); right: var(--margen); display: grid; grid-template-columns: 1fr 1fr; gap: 26px; z-index: 2; }
.col { border-radius: 26px; overflow: hidden; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.14); display: flex; flex-direction: column; }
.col .enc { font-family: 'Anton'; text-transform: uppercase; font-size: 40px; padding: 16px 22px 10px; display: flex; gap: 12px; align-items: center; }
.col.mal .enc { background: color-mix(in srgb, var(--mal) 88%, black); }
.col.bien .enc { background: color-mix(in srgb, var(--bien) 80%, black); color: #04140a; }
.col .vis { position: relative; flex: 1; overflow: hidden; background: #0d1114; }
.col .vis > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.col .vis.claro { background: #fff; }
.col .pie { font-weight: 700; font-size: 30px; line-height: 1.22; padding: 18px 22px 22px; }
.col .pie b { color: var(--acento); }
/* chat de ejemplo (genérico, sin marca de app) */
.chat { position: absolute; inset: 0; padding: 54px 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 20px;
  background: #0b1a17 radial-gradient(circle at 20% 10%, rgba(255,255,255,.04), transparent 60%); }
.burbuja { max-width: 92%; font-size: 31px; line-height: 1.25; font-weight: 600; padding: 14px 18px 30px; border-radius: 18px; position: relative; }
.burbuja .h { position: absolute; right: 14px; bottom: 6px; font-size: 19px; font-weight: 600; opacity: .62; }
.burbuja.cliente { align-self: flex-start; background: #1f2c33; border-top-left-radius: 4px; }
.burbuja.tu { align-self: flex-end; background: #0f5e4f; border-top-right-radius: 4px; }
.burbuja.nota { align-self: center; background: transparent; color: rgba(255,255,255,.62); font-style: italic; padding: 4px 8px; font-size: 27px; }
.ejemplo { position: absolute; right: 12px; top: 12px; font-size: 17px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,.55); border: 1.5px solid rgba(255,255,255,.3); border-radius: 8px; padding: 3px 8px; z-index: 2; }
/* señal sobre una captura o foto: óvalo rojo a mano (estudio de 50 virales, patrón 5) */
.circulo { position: absolute; z-index: 4; border: 7px solid var(--c); border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 0 26px color-mix(in srgb, var(--c) 60%, transparent); }
/* tarjeta de tuit propia (sus frases como tuits, patrón «Hormozi»): siempre en el mismo lugar */
.tuit { position: absolute; left: var(--margen); right: var(--margen); z-index: 3; background: #fff; color: #0f1419; border-radius: 26px;
  padding: 34px 36px 30px; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
.tuit .cab { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
.tuit .av { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: #ddd; }
.tuit .nom { font-weight: 800; font-size: 32px; line-height: 1.1; display: flex; align-items: center; gap: 8px; }
.tuit .nom i { display: inline-block; width: 28px; height: 28px; border-radius: 50%; background: #1d9bf0; color: #fff; font-style: normal; font-size: 19px; text-align: center; line-height: 28px; }
.tuit .us { font-weight: 500; font-size: 26px; color: #536471; }
.tuit .txt { font-weight: 500; font-size: 40px; line-height: 1.28; letter-spacing: -.2px; }
.tuit .txt b { color: inherit; font-weight: 800; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--acento) 55%, transparent) 58%); }
/* cierre: pregunta → explicación → botón → firma, todo a la izquierda; retrato recortado a la derecha */
.boton { display: inline-flex; align-items: center; gap: 16px; margin-top: 34px; font-family: 'Anton'; text-transform: uppercase;
  font-size: 50px; color: var(--tinta); background: var(--acento); padding: 14px 30px 8px; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
.boton span { background: var(--tinta); color: var(--acento); padding: 4px 16px 0; border-radius: 10px; }
.retrato { position: absolute; right: -30px; bottom: 0; z-index: 2; -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 16%); mask-image: linear-gradient(to top, transparent 0%, #000 16%); }
.retrato img { display: block; width: 100%; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
let H = 1350;  // alto del lienzo; lo fija window.pintar según «formato»
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// *palabras* = acento en el titular; **palabras** = negrita de acento en el cuerpo; \n = salto forzado
const tit = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
const cue = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const img = (src, pos, extra = '') => `<img src="${esc(src)}" alt="" style="object-position:${esc(pos ?? 'center')};${extra}">`;
const zoom = (z, o) => (z ? `transform:scale(${z});transform-origin:${esc(o ?? 'center')}` : '');
const impresa = (m, src, pos, pie, clasePie = 'credito', z, o) => `<div class="impresa" style="left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px;transform:rotate(${m.giro ?? 0}deg)${m.chica ? ';padding:16px 16px 44px' : ''}">
    <div class="ventana">${img(src, pos, zoom(z, o))}</div>${pie ? `<div class="credito ${clasePie}">${esc(pie)}</div>` : ''}</div>`;
const titulo = (d, def) => `<div class="titulo" style="font-size:${d.tam ?? def}px">${tit(d.titulo)}</div>`;
const cuerpo = (d, extra = '') => (d.cuerpo ? `<div class="cuerpo" style="${extra}">${cue(d.cuerpo)}</div>` : '');
const credito = (d) => (d.credito ? `<div class="credito-suelto">${esc(d.credito)}</div>` : '');
const arriba = (d, def) => `<div class="caja" style="top:${d.top ?? 78}px">${d.sello ? `<div class="sello">${esc(d.sello)}</div>` : ''}${titulo(d, def)}${cuerpo(d)}</div>`;
// captura real: { src, x, y, w, giro, fuente: "Fuente: PolitiFact · 2022", estampa: "Sin comprobar" }
const captura = (c) => `<div class="cap" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;transform:rotate(${c.giro ?? 0}deg)">
    <div class="hoja">${c.alto ? `<div style="height:${c.alto}px;overflow:hidden">${img(c.src, c.pos, `width:100%;height:100%;object-fit:cover`)}</div>` : img(c.src)}</div>
    ${c.fuente ? `<div class="fuente">${esc(c.fuente)}</div>` : ''}${c.estampa ? `<div class="estampa">${esc(c.estampa)}</div>` : ''}</div>`;
// elemento suelto: { src, x, y, w, giro, voltear, z }
const elemento = (e) => `<img class="elem" src="${esc(e.src)}" alt="" style="left:${e.x}px;top:${e.y}px;width:${e.w}px;transform:rotate(${e.giro ?? 0}deg)${e.voltear ? ' scaleX(-1)' : ''};z-index:${e.z ?? 2}">`;
const marca = (m) => `<div class="marca" style="left:${m.x}px;top:${m.y}px;transform:rotate(${m.giro ?? -8}deg);--c:${esc(m.color ?? 'var(--acento)')};font-size:${m.tam ?? 52}px">${esc(m.t)}</div>`;
const circulo = (c) => `<div class="circulo" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h ?? c.w}px;transform:rotate(${c.giro ?? -4}deg);--c:${esc(c.color ?? '#ff2d2d')}"></div>`;
const extras = (d) => (d.capturas ?? []).map(captura).join('') + (d.elementos ?? []).map(elemento).join('') + (d.marcas ?? []).map(marca).join('') + (d.circulos ?? []).map(circulo).join('') + credito(d);
const tuit = (t, top) => `<div class="tuit" style="top:${top}px"><div class="cab">${t.avatar ? `<img class="av" src="${esc(t.avatar)}" alt="">` : '<div class="av"></div>'}
    <div><div class="nom">${esc(t.nombre)}${t.verificado === false ? '' : '<i>✓</i>'}</div><div class="us">${esc(t.usuario)}</div></div></div><div class="txt">${cue(t.texto)}</div></div>`;
const fondo = (d) => (d.fondo ? `<img class="fondo ${d.efecto ?? 'borroso'}" src="${esc(d.fondo)}" alt="" style="object-position:${esc(d.pos ?? 'center')}">` : '');
const chat = (c) => `<div class="chat"><div class="ejemplo">Ejemplo</div>${(c.mensajes ?? []).map((m) =>
  `<div class="burbuja ${m.de ?? 'cliente'}">${cue(m.t)}${m.hora ? `<span class="h">${esc(m.hora)}</span>` : ''}</div>`).join('')}</div>`;
const columna = (c, clase) => `<div class="col ${clase}"><div class="enc">${clase === 'mal' ? '✕' : '✓'} ${esc(c.etiqueta)}</div>
    <div class="vis ${c.claro ? 'claro' : ''}">${c.chat ? chat(c.chat) : img(c.src, c.pos, c.ajuste ? `object-fit:${esc(c.ajuste)}` : '')}</div>${c.pie ? `<div class="pie">${cue(c.pie)}</div>` : ''}</div>`;

const LAYOUTS = {
  // sus frases como tuits: foto (real o avatar) a sangre que se funde a negro y la tarjeta siempre en el mismo lugar
  tuit: (d) => `<img class="fondo" src="${esc(d.fondo)}" alt="" style="object-position:${esc(d.pos ?? '50% 0%')}">
    <div class="velo-abajo" style="height:${d.velo ?? 62}%"></div>${tuit(d.tuit, d.topTuit ?? H - 560)}${extras(d)}`,
  // escena ilustrada (o foto) a sangre, titular arriba sobre un velo; capturas y elementos encima
  // «bajar»: px que se baja la escena para que el titular no tape una cara (el hueco de arriba queda en tinta)
  escena: (d) => `<img class="fondo" src="${esc(d.fondo)}" alt="" style="object-position:${esc(d.pos ?? '50% 100%')};${d.bajar ? `transform:translateY(${d.bajar}px) scale(${d.escala ?? 1});transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 260px);mask-image:linear-gradient(to bottom, transparent 0, #000 260px)` : ''}"><div class="velo-arriba" style="height:${d.velo ?? 52}%"></div>
    ${arriba(d, 100)}${extras(d)}`,
  // capturas reales con contexto: titular y cuerpo arriba, 1–2 capturas abajo
  capturas: (d) => `${fondo(d)}<div class="halo"></div>${arriba(d, 92)}${extras(d)}`,
  // comparativa ✕ / ✓ (antes y después, mal y bien, captura contra banco)
  comparativa: (d) => `${fondo(d)}<div class="halo"></div>${arriba(d, 92)}
    <div class="comp" style="top:${d.topComp ?? 430}px;height:${d.altoComp ?? H - (d.topComp ?? 430) - 90}px">${columna(d.mal, 'mal')}${columna(d.bien, 'bien')}</div>${extras(d)}`,
  // recuerdo: foto impresa sobre la misma foto desenfocada, titular arriba
  impresa: (d) => `<img class="fondo borroso" src="${esc(d.fondo ?? d.foto)}" alt=""><div class="halo"></div>
    <div class="caja" style="top:${d.top ?? 74}px">${titulo(d, 110)}</div>
    ${impresa(d.marco ?? { x: 150, y: 470, w: 780, h: H - 560, giro: -2.6 }, d.foto, d.pos, d.credito)}${extras(d)}`,
  // el momento: foto a sangre, sello y titular abajo (las caras quedan libres arriba)
  sangre: (d) => `<img class="fondo" src="${esc(d.foto)}" alt="" style="object-position:${esc(d.pos ?? '50% 0%')}"><div class="velo-abajo"></div>
    <div class="caja" style="bottom:${d.abajo ?? 96}px">${d.sello ? `<div class="sello">${esc(d.sello)}</div>` : ''}${titulo(d, 100)}${cuerpo(d)}</div>${extras(d)}`,
  // antes y después con fotos: el presente a sangre y el pasado impreso en una esquina con su año
  'antes-despues': (d) => `<img class="fondo" src="${esc(d.foto)}" alt="" style="object-position:${esc(d.pos ?? '50% 0%')}"><div class="velo-abajo" style="height:50%"></div>
    ${impresa(d.antes.marco ?? { x: 46, y: 64, w: 360, h: 450, giro: -4, chica: true }, d.antes.src, d.antes.pos, d.antes.etiqueta, 'ano', d.antes.zoom, d.antes.origen)}
    <div class="caja" style="bottom:${d.abajo ?? 96}px">${titulo(d, 92)}</div>${extras(d)}`,
  // la idea: titular y cuerpo arriba, los recuerdos abajo
  idea: (d) => `${fondo(d)}<div class="halo"></div>${arriba(d, 108)}
    ${(d.recuerdos ?? []).map((r, i) => impresa(r.marco ?? { x: i ? 556 : 96, y: H - 600, w: 430, h: 500, giro: i ? 4 : -5, chica: true }, r.src, r.pos)).join('')}${extras(d)}`,
  // texto: una idea con su explicación; SIEMPRE con un recurso visual (foto impresa, captura o elemento)
  texto: (d) => `${fondo(d)}<div class="halo"></div>${arriba(d, 100)}
    ${d.foto ? impresa(d.marco ?? { x: 250, y: H - 640, w: 580, h: 560, giro: 3 }, d.foto, d.fotoPos, d.credito) : ''}${extras(d)}`,
  // lista: pasos o puntos numerados (3 a 5), lo que se guarda
  lista: (d) => `${fondo(d)}<div class="halo"></div>
    <div class="caja" style="top:${d.top ?? 78}px;${d.anchoTexto ? `right:auto;width:${d.anchoTexto}px` : ''}">${titulo(d, 92)}
      <div style="margin-top:${d.separacion ?? 48}px;display:flex;flex-direction:column;gap:${d.hueco ?? 36}px">${(d.items ?? []).map((it, k) => `
        <div style="display:flex;gap:26px;align-items:flex-start">
          <div style="flex:0 0 78px;height:78px;border-radius:50%;background:var(--acento);color:var(--tinta);font-family:'Anton';font-size:46px;display:flex;align-items:center;justify-content:center">${k + 1}</div>
          <div><div style="font-weight:800;font-size:46px;line-height:1.1">${cue(it.t)}</div>${it.d ? `<div class="cuerpo" style="margin-top:8px;font-size:32px">${cue(it.d)}</div>` : ''}</div>
        </div>`).join('')}</div></div>${extras(d)}`,
  // cierre: pregunta → explicación → botón → firma, a la izquierda; retrato (recorte PNG) a la derecha
  cierre: (d) => `${fondo(d)}<div class="halo" style="background:radial-gradient(60% 50% at 75% 70%, color-mix(in srgb, var(--acento) 22%, transparent), transparent 70%)"></div>
    ${d.retrato ? `<div class="retrato" style="width:${d.retrato.w ?? 640}px;${d.retrato.x != null ? `left:${d.retrato.x}px;right:auto` : ''}">${img(d.retrato.src)}</div>` : ''}
    <div class="caja" style="top:${d.top ?? 78}px;right:auto;width:${d.anchoTexto ?? 620}px">${d.sello ? `<div class="sello">${esc(d.sello)}</div>` : ''}${titulo(d, 96)}${cuerpo(d, 'font-size:36px')}
      ${d.accion ? `<div class="boton">${esc(d.accion)}${d.palabra ? ` <span>${esc(d.palabra)}</span>` : ''}</div>` : ''}</div>
    ${d.firma ? `<div class="firma">${esc(d.firma)}</div>` : ''}${extras(d)}`,
};

window.pintar = async (d, global) => {
  H = global.formato === '3:4' ? 1440 : 1350;
  document.documentElement.style.setProperty('--alto', H + 'px');
  for (const [k, v] of Object.entries({ '--acento': global.acento, '--sello': global.sello })) if (v) document.documentElement.style.setProperty(k, v);
  document.getElementById('raiz').innerHTML = `<div class="lam">${LAYOUTS[d.layout]({ firma: global.firma, ...d })}<div class="grano"></div></div>`;
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  const t = document.querySelector('.titulo');
  if (!t) return 0;  // «tuit» no lleva titular
  let tam = parseFloat(getComputedStyle(t).fontSize);
  while (t.scrollWidth > t.parentElement.clientWidth && tam > 64) { tam -= 4; t.style.fontSize = tam + 'px'; }
  return tam;
};
</script>
</body>
</html>
