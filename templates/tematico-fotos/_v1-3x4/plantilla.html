<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel temático con fotos reales</title>
<style>
/* Carrusel temático con fotos reales (1080x1440). Para remezclar un momento viral ajeno con su foto real:
   el pasado va en fotos impresas (recuerdo), el presente a sangre. Sin serie, sin número de lámina, sin
   paginador y sin frases de transición: eso delata la plantilla. Guía: references/REMIX-VIRAL.md. */
@font-face { font-family: 'Anton'; src: url('../../assets/fonts/Anton.ttf'); }
@font-face { font-family: 'Archivo'; src: url('../../assets/fonts/Archivo.ttf'); font-weight: 100 900; }
:root { --acento: #00d7c0; --sello: #f5c84c; --tinta: #05080a; --blanco: #ffffff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden; background: var(--tinta); }
.lam { position: relative; width: 1080px; height: 1440px; overflow: hidden; color: var(--blanco); font-family: 'Archivo', sans-serif; }
.fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fondo.borroso { filter: blur(26px) brightness(.32) saturate(1.15); transform: scale(1.15); }
.velo-abajo { position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(to top, rgba(3,6,8,.96) 0%, rgba(3,6,8,.8) 48%, rgba(3,6,8,0) 100%); }
.halo { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 58%, color-mix(in srgb, var(--acento) 18%, transparent), transparent 70%); }
.grano { position: absolute; inset: 0; opacity: .13; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.9'/></svg>"); }
.caja { position: absolute; left: 70px; right: 70px; }
.titulo { font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: .98; letter-spacing: .5px;
  font-size: 112px; text-shadow: 0 6px 26px rgba(0,0,0,.6); }
.titulo em { font-style: normal; color: var(--acento); }
.cuerpo { font-weight: 600; font-size: 41px; line-height: 1.3; margin-top: 26px; color: rgba(255,255,255,.94);
  text-shadow: 0 3px 14px rgba(0,0,0,.65); }
.cuerpo b { color: var(--acento); font-weight: 800; }
.centro { text-align: center; }
.impresa { position: absolute; background: #f4f1ea; padding: 22px 22px 70px; box-shadow: 0 34px 70px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.4) inset; }
.impresa .ventana { width: 100%; height: 100%; overflow: hidden; }
.impresa img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.92) contrast(1.03); }
.impresa .credito { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-weight: 600; font-size: 22px; color: #6b6a66; letter-spacing: .3px; }
.impresa .ano { font-family: 'Anton'; font-size: 30px; color: #1a1a1a; letter-spacing: 1px; bottom: 12px; }
.credito-suelto { position: absolute; right: 34px; bottom: 26px; font-weight: 600; font-size: 22px; color: rgba(255,255,255,.62); }
.sello { display: inline-block; font-family: 'Anton'; text-transform: uppercase; font-size: 60px; color: var(--tinta);
  background: var(--sello); padding: 8px 28px 2px; transform: rotate(-5deg); box-shadow: 0 12px 32px rgba(0,0,0,.5); margin-bottom: 34px; }
.firma { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-weight: 700; font-size: 32px; color: rgba(255,255,255,.75); letter-spacing: .5px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// *palabras* = acento en el titular; **palabras** = negrita de acento en el cuerpo; \n = salto forzado
const tit = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
const cue = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const img = (src, pos, extra = '') => `<img src="${esc(src)}" alt="" style="object-position:${esc(pos ?? 'center')};${extra}">`;
const zoom = (z, o) => (z ? `transform:scale(${z});transform-origin:${esc(o ?? 'center')}` : '');
const impresa = (m, src, pos, pie, clasePie = 'credito', z, o) => `<div class="impresa" style="left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px;transform:rotate(${m.giro ?? 0}deg)${m.chica ? ';padding:16px 16px 44px' : ''}">
    <div class="ventana">${img(src, pos, zoom(z, o))}</div>${pie ? `<div class="credito ${clasePie}">${esc(pie)}</div>` : ''}</div>`;
const titulo = (d, def) => `<div class="titulo" style="font-size:${d.tam ?? def}px">${tit(d.titulo)}</div>`;
const credito = (d) => (d.credito ? `<div class="credito-suelto">${esc(d.credito)}</div>` : '');

const LAYOUTS = {
  // recuerdo: foto impresa sobre la misma foto desenfocada, titular arriba
  impresa: (d) => `<img class="fondo borroso" src="${esc(d.fondo ?? d.foto)}" alt=""><div class="halo"></div>
    <div class="caja" style="top:${d.top ?? 74}px">${titulo(d, 118)}</div>
    ${impresa(d.marco ?? { x: 150, y: 500, w: 780, h: 930, giro: -2.6 }, d.foto, d.pos, d.credito)}`,
  // el momento: foto a sangre, sello y titular abajo (las caras quedan libres arriba)
  sangre: (d) => `<img class="fondo" src="${esc(d.foto)}" alt="" style="object-position:${esc(d.pos ?? '50% 0%')}"><div class="velo-abajo"></div>
    <div class="caja" style="bottom:${d.abajo ?? 96}px">${d.sello ? `<div class="sello">${esc(d.sello)}</div>` : ''}${titulo(d, 104)}
    ${d.cuerpo ? `<div class="cuerpo">${cue(d.cuerpo)}</div>` : ''}</div>${credito(d)}`,
  // antes y después: el presente a sangre y el pasado impreso en una esquina con su año
  'antes-despues': (d) => `<img class="fondo" src="${esc(d.foto)}" alt="" style="object-position:${esc(d.pos ?? '50% 0%')}"><div class="velo-abajo" style="height:50%"></div>
    ${impresa(d.antes.marco ?? { x: 46, y: 64, w: 360, h: 470, giro: -4, chica: true }, d.antes.src, d.antes.pos, d.antes.etiqueta, 'ano', d.antes.zoom, d.antes.origen)}
    <div class="caja" style="bottom:${d.abajo ?? 96}px">${titulo(d, 96)}</div>${credito(d)}`,
  // la idea: titular y cuerpo arriba, los recuerdos abajo
  idea: (d) => `<img class="fondo borroso" src="${esc(d.fondo)}" alt=""><div class="halo"></div>
    <div class="caja" style="top:${d.top ?? 96}px">${titulo(d, 116)}${d.cuerpo ? `<div class="cuerpo">${cue(d.cuerpo)}</div>` : ''}</div>
    ${(d.recuerdos ?? []).map((r, i) => impresa(r.marco ?? { x: i ? 556 : 96, y: i ? 780 : 800, w: 430, h: 520, giro: i ? 4 : -5, chica: true }, r.src, r.pos)).join('')}`,
  // texto: una idea con su explicación; fondo de foto desenfocada (o a sangre con velo si «nitido»)
  texto: (d) => `${d.fondo ? `<img class="fondo ${d.nitido ? '' : 'borroso'}" src="${esc(d.fondo)}" alt="" style="object-position:${esc(d.pos ?? 'center')}">` : ''}
    ${d.nitido ? '<div class="velo-abajo" style="height:100%;background:linear-gradient(to bottom, rgba(3,6,8,.92) 0%, rgba(3,6,8,.55) 55%, rgba(3,6,8,.85) 100%)"></div>' : '<div class="halo"></div>'}
    <div class="caja" style="${d.foto || d.top ? `top:${d.top ?? 110}px` : 'top:47%;transform:translateY(-50%)'}">${titulo(d, d.foto ? 108 : 122)}${d.cuerpo ? `<div class="cuerpo" style="${d.foto ? '' : 'font-size:50px;margin-top:40px'}">${cue(d.cuerpo)}</div>` : ''}</div>
    ${d.foto ? impresa(d.marco ?? { x: 250, y: 760, w: 580, h: 600, giro: 3 }, d.foto, d.fotoPos, d.credito) : credito(d)}`,
  // lista: pasos o puntos numerados (3 a 5), lo que se guarda
  lista: (d) => `${d.fondo ? `<img class="fondo borroso" src="${esc(d.fondo)}" alt="">` : ''}<div class="halo"></div>
    <div class="caja" style="top:${d.top ?? 90}px">${titulo(d, 96)}
      <div style="margin-top:60px;display:flex;flex-direction:column;gap:46px">${(d.items ?? []).map((it, k) => `
        <div style="display:flex;gap:28px;align-items:flex-start">
          <div style="flex:0 0 86px;height:86px;border-radius:50%;background:var(--acento);color:var(--tinta);font-family:'Anton';font-size:50px;display:flex;align-items:center;justify-content:center">${k + 1}</div>
          <div><div style="font-weight:800;font-size:52px;line-height:1.12">${cue(it.t)}</div>${it.d ? `<div class="cuerpo" style="margin-top:10px;font-size:38px">${cue(it.d)}</div>` : ''}</div>
        </div>`).join('')}</div></div>${credito(d)}`,
  // cierre: la pregunta, la acción y una foto impresa del momento
  cierre: (d) => `<img class="fondo borroso" src="${esc(d.fondo ?? d.foto)}" alt=""><div class="halo" style="background:radial-gradient(70% 50% at 50% 45%, color-mix(in srgb, var(--acento) 20%, transparent), transparent 70%)"></div>
    <div class="caja centro" style="top:${d.top ?? 96}px">${titulo(d, 108)}
      ${d.cuerpo ? `<div class="cuerpo" style="font-size:44px;margin-top:40px">${cue(d.cuerpo)}</div>` : ''}
      ${d.nota ? `<div class="cuerpo" style="font-size:36px;margin-top:20px;color:rgba(255,255,255,.8)">${cue(d.nota)}</div>` : ''}</div>
    ${d.foto ? impresa(d.marco ?? { x: 250, y: 700, w: 580, h: 640, giro: -3 }, d.foto, d.pos, d.credito) : ''}
    ${d.firma ? `<div class="firma">${esc(d.firma)}</div>` : ''}`,
};

window.pintar = async (d, global) => {
  for (const [k, v] of Object.entries({ '--acento': global.acento, '--sello': global.sello })) if (v) document.documentElement.style.setProperty(k, v);
  document.getElementById('raiz').innerHTML = `<div class="lam">${LAYOUTS[d.layout]({ firma: global.firma, ...d })}<div class="grano"></div></div>`;
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  const t = document.querySelector('.titulo');
  let tam = parseFloat(getComputedStyle(t).fontSize);
  while (t.scrollWidth > t.parentElement.clientWidth && tam > 70) { tam -= 4; t.style.fontSize = tam + 'px'; }
  return tam;
};
</script>
</body>
</html>
